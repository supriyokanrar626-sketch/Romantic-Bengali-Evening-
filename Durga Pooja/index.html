<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>শুভ শারদীয়া - দুর্গা পূজা</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>

<body>

  <!-- Background Image -->
  <div class="bg-container" id="bg-container"></div>

  <!-- Dark Overlay -->
  <div class="overlay"></div>

  <div class="container">

    <h1 class="main-title">শুভ শারদীয়া</h1>

    <!-- Player Card -->
    <div class="player-card">

      <!-- Song Information -->
      <div class="song-details">
        <h3 id="song-title">Playlist Loading...</h3>
        <p id="artist-name">YouTube Playlist</p>
      </div>

      <!-- Hidden YouTube Player -->
      <div id="youtube-player" class="youtube-player"></div>

      <!-- Time -->
      <div class="time-container">
        <span id="current-time">0:00</span>
        <span id="total-time">0:00</span>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
      </div>

      <!-- Controls -->
      <div class="controls">

        <!-- Previous -->
        <button id="prev-btn" class="ctrl-btn" title="Previous">
          <i class="fas fa-step-backward"></i>
        </button>

        <!-- Play / Pause -->
        <button id="play-btn" class="play-btn" title="Play">
          <i class="fas fa-play" id="play-icon"></i>
        </button>

        <!-- Next -->
        <button id="next-btn" class="ctrl-btn" title="Next">
          <i class="fas fa-step-forward"></i>
        </button>

      </div>

      <!-- Playlist Counter -->
      <div class="playlist-info">
        <span id="playlist-position">1 / 1</span>
      </div>

    </div>

  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Your JavaScript -->
  <script src="script.js"></script>

</body>
</html>
